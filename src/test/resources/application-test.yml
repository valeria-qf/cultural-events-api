spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/culturalevents
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}
